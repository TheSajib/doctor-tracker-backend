openapi: 3.0.3
info:
  title: Doctor Tracker API
  version: 1.0.0
  description: |
    Authentication, doctors, patients, and the clinic dashboard for the Doctor Tracker portal.
    Paths are unversioned so the existing Next.js client can keep calling
    `/auth/login` and `/auth/signup`. Every route except `GET /health`,
    `POST /auth/login`, and `POST /auth/signup` requires a bearer token for
    a session that has not been revoked. Any authenticated clinic account
    may use the portal; there is no second role yet.
    Passwords are never returned. Errors always include `message` and `code`.
    The Next.js client displays `message`.
servers:
  - url: http://localhost:4000
tags:
  - name: Health
  - name: Authentication
  - name: Doctors
  - name: Patients
  - name: Dashboard
paths:
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Service health
      description: Public. Does not require a session.
      security: []
      responses:
        "200":
          description: Database connection is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
        "503":
          description: Database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Database unavailable.
                code: unavailable
  /auth/signup:
    post:
      tags: [Authentication]
      operationId: signup
      summary: Create an account and sign in
      description: |
        Creates a clinic account, stores a bcrypt password hash, and opens
        a session. Duplicate emails return 409.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
            example:
              name: Amina Rahman
              email: amina@example.com
              password: Clinic#2026
      responses:
        "201":
          description: Account created and session opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                user:
                  id: 6740c5a1b2e4f0a1d2c3b4e5
                  name: Amina Rahman
                  email: amina@example.com
        "400":
          description: One or more fields are invalid. `fields` lists each one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Use at least 8 characters
                code: validation_error
                fields:
                  password: Use at least 8 characters
        "409":
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: An account with this email already exists.
                code: email_taken
        "429":
          description: Too many signup attempts from this client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too many attempts. Try again later.
                code: rate_limited
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in
      description: |
        Unknown emails and wrong passwords return the same 401 message.
        Email is trimmed and compared case-insensitively.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: sajibcse28@gmail.com
              password: Admin@123
      responses:
        "200":
          description: Session opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                user:
                  id: 6740c5a1b2e4f0a1d2c3b4e5
                  name: Sajib
                  email: sajibcse28@gmail.com
        "401":
          description: Email or password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Email or password is incorrect.
                code: invalid_credentials
        "429":
          description: Too many login attempts from this client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too many attempts. Try again later.
                code: rate_limited
  /auth/me:
    get:
      tags: [Authentication]
      operationId: currentUser
      summary: Current signed-in user
      description: Confirms the bearer token still maps to a live session.
      responses:
        "200":
          description: The account for this session.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
              example:
                user:
                  id: 6740c5a1b2e4f0a1d2c3b4e5
                  name: Sajib
                  email: sajibcse28@gmail.com
        "401":
          description: Missing, invalid, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing:
                  summary: No token
                  value:
                    message: Sign in required.
                    code: unauthorized
                revoked:
                  summary: Logged out
                  value:
                    message: Session expired. Sign in again.
                    code: session_expired
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      description: |
        Marks the session revoked. The same bearer token then fails
        `GET /auth/me` with 401. No response body.
      responses:
        "204":
          description: Session revoked.
        "401":
          description: Missing, invalid, expired, or already revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Sign in required.
                code: unauthorized
  /doctors:
    get:
      tags: [Doctors]
      operationId: listDoctors
      summary: List doctors
      description: |
        Search matches name, hospital, email, phone, and specialization.
        `range` is `7d`, `30d`, or `90d` and is omitted for any date.
        `specialization` is omitted for every specialization.
        Each row includes `patientCount`.
        Rows are newest first: latest `joinedAt`, then latest id.
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: specialization
          schema: { type: string }
        - in: query
          name: range
          schema: { type: string, enum: ["7d", "30d", "90d"] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 6 }
      responses:
        "200":
          description: One page of doctors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorPage"
        "401":
          description: Sign in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Doctors]
      operationId: createDoctor
      summary: Add a doctor
      description: Joined date is today. A duplicate email returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorInput"
            example:
              name: Dr. Nabila Chowdhury
              specialization: Cardiology
              hospital: Square Hospital
              phone: "+8801711112233"
              email: nabila@square.com
      responses:
        "201":
          description: Doctor created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already used by a doctor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: A doctor with this email already exists.
                code: email_taken
  /doctors/{id}:
    get:
      tags: [Doctors]
      operationId: getDoctor
      summary: One doctor
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Doctor including patientCount.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorRow"
        "404":
          description: No doctor with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /patients:
    get:
      tags: [Patients]
      operationId: listPatients
      summary: List patients
      description: |
        Search matches patient name, phone, and doctor name.
        Each row includes `doctorName`. Admission dates are `YYYY-MM-DD`.
        Rows are newest first: latest `admittedAt`, then latest id.
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: condition
          schema: { type: string }
        - in: query
          name: doctorId
          schema: { type: string }
        - in: query
          name: range
          schema: { type: string, enum: ["7d", "30d", "90d"] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 8 }
      responses:
        "200":
          description: One page of patients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientPage"
    post:
      tags: [Patients]
      operationId: createPatient
      summary: Admit a patient
      description: Admission date is today and is not accepted from the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Patient admitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          description: Validation failed, or the doctor is not in the network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /patients/{id}:
    patch:
      tags: [Patients]
      operationId: updatePatient
      summary: Update a patient
      description: Same body as create. The admission date stays unchanged.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "200":
          description: Updated patient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Patient is no longer on the list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Patients]
      operationId: deletePatient
      summary: Remove a patient
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Patient removed.
        "404":
          description: Patient is no longer on the list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Clinic dashboard
      description: Totals, condition mix, patients per doctor, and admissions for the last 30 days.
      responses:
        "200":
          description: Dashboard computed from the current doctors and patients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT from login or signup. Send as Authorization Bearer token."
  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
    Session:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: Bearer token. Expires in 7 days and can be revoked with logout.
        user:
          $ref: "#/components/schemas/User"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    SignupRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
    Doctor:
      type: object
      required: [id, name, specialization, hospital, phone, email, joinedAt]
      properties:
        id: { type: string }
        name: { type: string }
        specialization: { type: string }
        hospital: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        joinedAt: { type: string, description: "YYYY-MM-DD" }
    DoctorRow:
      allOf:
        - $ref: "#/components/schemas/Doctor"
        - type: object
          required: [patientCount]
          properties:
            patientCount: { type: integer }
    DoctorInput:
      type: object
      required: [name, specialization, hospital, phone, email]
      properties:
        name: { type: string, minLength: 3, maxLength: 80 }
        specialization:
          type: string
          enum: [Cardiology, Dermatology, Orthopedics, Neurology, Pediatrics, Gynecology, Oncology, General Medicine]
        hospital: { type: string }
        phone: { type: string, description: "E.164, for example +8801711112233" }
        email: { type: string, format: email }
    DoctorPage:
      type: object
      required: [items, total, page, pageSize, pages, from, to]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DoctorRow"
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        pages: { type: integer }
        from: { type: integer }
        to: { type: integer }
    Patient:
      type: object
      required: [id, name, gender, age, phone, condition, doctorId, admittedAt, notes]
      properties:
        id: { type: string }
        name: { type: string }
        gender: { type: string, enum: [Male, Female, Other] }
        age: { type: integer }
        phone: { type: string }
        condition: { type: string, enum: [Stable, Recovering, Critical, Under Observation] }
        doctorId: { type: string }
        admittedAt: { type: string, description: "YYYY-MM-DD. Set by the server." }
        notes: { type: string }
    PatientRow:
      allOf:
        - $ref: "#/components/schemas/Patient"
        - type: object
          required: [doctorName]
          properties:
            doctorName: { type: string }
    PatientInput:
      type: object
      required: [name, gender, age, phone, condition, doctorId, notes]
      properties:
        name: { type: string, minLength: 3, maxLength: 80 }
        gender: { type: string, enum: [Male, Female, Other] }
        age: { type: integer, minimum: 0, maximum: 120 }
        phone: { type: string }
        condition: { type: string, enum: [Stable, Recovering, Critical, Under Observation] }
        doctorId: { type: string }
        notes: { type: string, maxLength: 500 }
    PatientPage:
      type: object
      required: [items, total, page, pageSize, pages, from, to]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PatientRow"
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        pages: { type: integer }
        from: { type: integer }
        to: { type: integer }
    Dashboard:
      type: object
      required: [totalDoctors, totalPatients, newPatients7d, criticalCases, avgPerDoctor, conditions, patientsPerDoctor, registrations]
      properties:
        totalDoctors: { type: integer }
        totalPatients: { type: integer }
        newPatients7d: { type: integer }
        criticalCases: { type: integer }
        avgPerDoctor: { type: number }
        conditions:
          type: array
          items:
            type: object
            required: [condition, count]
            properties:
              condition: { type: string }
              count: { type: integer }
        patientsPerDoctor:
          type: array
          items:
            type: object
            required: [id, name, count]
            properties:
              id: { type: string }
              name: { type: string }
              count: { type: integer }
        registrations:
          type: array
          items:
            type: object
            required: [date, label, registrations, critical]
            properties:
              date: { type: string }
              label: { type: string }
              registrations: { type: integer }
              critical: { type: integer }
    Error:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
          description: Present on validation errors, one message per field.
security:
  - bearerAuth: []
