$kind: http-request
description: A live session reaches routing. An unknown path is 404 rather than hidden.
url: "{{baseUrl}}/not-a-resource"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("authenticated unknown resource is not found", function () {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().code).to.eql("not_found");
      });
settings: {}
order: 3500
