$kind: http-example
name: Missing, invalid, expired, or revoked token.
request:
  url: "{{baseUrl}}/auth/me"
  method: GET
  headers:
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Sign in required.",
        "code": "unauthorized"
      }
order: 2000
