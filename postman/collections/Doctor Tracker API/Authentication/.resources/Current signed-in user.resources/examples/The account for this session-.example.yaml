$kind: http-example
name: The account for this session.
request:
  url: "{{baseUrl}}/auth/me"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "user": {
          "id": "6740c5a1b2e4f0a1d2c3b4e5",
          "name": "Sajib",
          "email": "sajibcse28@gmail.com"
        }
      }
order: 1000
